<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VEER ADVENTURE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#071d31;
 color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
 touch-action:none;
}
#app{
 width:100%;
 height:100dvh;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:space-between;
}
header{
 width:100%;
 min-height:58px;
 background:#092c46;
 display:flex;
 justify-content:space-around;
 align-items:center;
 padding:5px 12px;
 gap:8px;
}
.logo{font-size:clamp(16px,2.5vw,27px);font-weight:bold;color:#ffd43b}
.info{font-size:clamp(13px,2vw,21px);font-weight:bold;white-space:nowrap}
#pause{
 background:#ffcf35;
 color:#102b43;
 border:0;
 border-radius:12px;
 padding:10px 17px;
 font-size:22px;
 font-weight:bold;
}
#gameBox{
 width:min(100vw, calc((100dvh - 135px)*1.7778));
 aspect-ratio:16/9;
 max-height:calc(100dvh - 135px);
 position:relative;
}
canvas{
 width:100%;
 height:100%;
 display:block;
 background:#70c9ef;
 border-radius:3px;
}
#controls{
 width:100%;
 min-height:105px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:8px 7%;
 background:#071d31;
}
.group{display:flex;gap:12px}
.ctrl{
 width:clamp(58px,10vw,90px);
 height:clamp(54px,9vw,78px);
 border:3px solid #65c5ff;
 border-radius:17px;
 background:linear-gradient(#168cf5,#0752b9);
 color:white;
 font-size:clamp(24px,4vw,38px);
 font-weight:bold;
 box-shadow:0 5px #063c80;
 touch-action:none;
}
#jump{
 width:clamp(105px,17vw,155px);
 height:clamp(55px,9vw,76px);
 border:3px solid #ffe18a;
 border-radius:18px;
 background:linear-gradient(#ffdf49,#ff9f08);
 color:#17334a;
 font-size:clamp(17px,3vw,25px);
 font-weight:bold;
 box-shadow:0 5px #a65c00;
}
#message{
 position:absolute;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#0009;
}
.panel{
 background:#092c46;
 border:2px solid #ffd43b;
 border-radius:18px;
 padding:22px;
 text-align:center;
 width:min(85%,350px);
}
.panel h2{font-size:22px;margin-bottom:10px}
.panel p{font-size:15px;margin-bottom:15px}
.panel button{
 padding:11px 25px;
 background:#ffcf35;
 border:0;border-radius:10px;
 font-size:17px;font-weight:bold;
}
@media(max-height:430px){
 header{min-height:42px}
 #gameBox{width:min(100vw,calc((100dvh - 92px)*1.7778));max-height:calc(100dvh - 92px)}
 #controls{min-height:50px;padding:3px 7%}
 .ctrl{height:42px}
 #jump{height:42px}
}
 /* Disable browser text selection */
* {
  -webkit-user-select: none !important;
  user-select: none !important;
  -webkit-touch-callout: none !important;
}

canvas, button {
  -webkit-user-select: none !important;
  user-select: none !important;
  -webkit-touch-callout: none !important;
}

html, body {
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>

<body>
<div id="app">

<header>
 <div class="logo">🌴 VEER ADVENTURE</div>
 <div class="info" id="level">LEVEL 1 / 10</div>
 <div class="info" id="coins">🪙 0</div>
 <div class="info" id="lives">❤️ 3</div>
 <button id="pause">Ⅱ</button>
</header>

<div id="gameBox">
 <canvas id="game" width="960" height="540"></canvas>
 <div id="message">
  <div class="panel">
   <h2 id="msgTitle">LEVEL COMPLETE!</h2>
   <p id="msgText">Next jungle awaits!</p>
   <button id="continue">CONTINUE</button>
  </div>
 </div>
</div>

<div id="controls">
 <div class="group">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <button id="jump">⬆ JUMP</button>
</div>

</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=960,H=540;

let level=1,coins=0,lives=3;
let running=false,paused=false,gameOver=false;
let camera=0,frame=0;
let platforms=[],enemies=[],treasures=[];
let finishX=0,worldWidth=0;

const keys={left:false,right:false,jump:false};

const maps=[
 [[0,455,650],[760,400,300],[1120,450,350],[1570,390,320],[2040,440,350],[2510,380,350],[3020,455,450]],
 [[0,455,650],[730,420,260],[1080,365,300],[1500,430,280],[1900,355,330],[2370,405,320],[2830,455,500]],
 [[0,455,500],[650,400,300],[1050,455,250],[1450,350,350],[1900,405,300],[2350,330,350],[2800,455,500]],
 [[0,455,700],[820,370,280],[1210,430,250],[1590,350,330],[2050,455,280],[2450,380,350],[2940,455,500]],
 [[0,455,450],[600,380,300],[1000,320,280],[1400,420,300],[1840,350,330],[2300,400,300],[2760,455,550]],
 [[0,455,600],[750,390,280],[1150,330,300],[1580,420,280],[2000,350,350],[2480,400,300],[2930,455,500]],
 [[0,455,500],[650,350,280],[1050,420,300],[1500,320,300],[1950,390,350],[2450,340,300],[2900,455,500]],
 [[0,455,700],[820,410,250],[1200,340,300],[1630,440,300],[2080,360,280],[2500,420,300],[2950,455,500]],
 [[0,455,500],[650,390,300],[1100,330,280],[1510,410,300],[1950,320,350],[2430,390,300],[2890,455,550]],
 [[0,455,600],[750,350,300],[1200,430,300],[1650,330,350],[2130,400,300],[2580,340,350],[3070,455,600]]
];

function makeLevel(){
 camera=0;
 frame=0;
 platforms=maps[level-1].map(p=>[...p]);
 worldWidth=platforms[platforms.length-1][0]+platforms[platforms.length-1][2];
 finishX=worldWidth-120;

 const start=platforms[0];
 player={x:80,y:start[1]-72,w:48,h:72,vx:0,vy:0,ground:true,inv:0,face:1};

 treasures=[];
 enemies=[];

 platforms.forEach((p,i)=>{
  if(i===0||i===platforms.length-1)return;

  for(let j=0;j<2;j++){
   treasures.push({
    x:p[0]+70+j*85,
    y:p[1]-85,
    got:false
   });
  }

  if(i%2===1){
   const size=36;
   enemies.push({
    x:p[0]+p[2]/2,
    home:p[0]+p[2]/2,
    min:p[0]+size,
    max:p[0]+p[2]-size,
    y:p[1]-size,
    size,dir:1,alive:true
   });
  }
 });

 updateUI();
}

let player={};

 // SOHAN HERO SPRITE
const heroSheet = new Image();
heroSheet.src = "assets/hero-vyro.png";
// SOHAN RUNNING ANIMATION
const heroRunSheet = new Image();
heroRunSheet.src = "assets/hero-animation.png";
 function updateUI(){
 document.getElementById("level").textContent="LEVEL "+level+" / 10";
 document.getElementById("coins").textContent="🪙 "+coins;
 document.getElementById("lives").textContent="❤️ "+lives;
}

function roundRect(x,y,w,h,r){
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function background(){

 const world = Math.max(1,Math.min(10,level||1));

 const scenes = [
  ["#62c9f5","#d9f7c0"], // Jungle
  ["#5bb8ed","#e5f4ff"], // Mountain
  ["#17152f","#65518c"], // Cave
  ["#f59b43","#ffe5a5"], // Desert
  ["#6ca9d5","#eafaff"], // Ice
  ["#8d3028","#f5a044"], // Volcano
  ["#49b8c0","#c8f3d6"], // River
  ["#11152e","#40345f"], // Night
  ["#4b9de0","#c5eaff"], // Sky
  ["#321d39","#c65b52"]  // Castle
 ];

 const colors=scenes[world-1];

 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,colors[0]);
 g.addColorStop(1,colors[1]);

 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 function circle(x,y,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
 }

 function mountain(x,y,w,h,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+w/2,y-h);
  ctx.lineTo(x+w,y);
  ctx.closePath();
  ctx.fill();
 }

 function cloud(x,y,s=1){
  ctx.fillStyle="#ffffffcc";
  ctx.beginPath();
  ctx.arc(x,y,22*s,0,7);
  ctx.arc(x+27*s,y-13*s,29*s,0,7);
  ctx.arc(x+58*s,y,23*s,0,7);
  ctx.fill();
 }

 function tree(x,y,color="#087447",size=1){
  ctx.fillStyle="#68452d";
  ctx.fillRect(x-8*size,y,18*size,100*size);

  circle(x,y-15*size,39*size,color);
  circle(x-27*size,y-2*size,26*size,color);
  circle(x+27*size,y-2*size,26*size,color);
 }

 const parallax=(speed,step)=> 
  ((-camera*speed)%step+step)%step;

 // LEVEL 1: GREEN JUNGLE
 if(world===1){

  circle(810,85,45,"#fff3a0");

  for(let i=0;i<6;i++){
   let x=parallax(.15,1100)+i*220-100;
   cloud(x,115,1);
  }

  for(let i=0;i<7;i++){
   let x=parallax(.28,1200)+i*210-100;
   mountain(x,370,210,160,"#398e83");
  }

  for(let i=0;i<10;i++){
   let x=parallax(.48,1250)+i*150-100;
   tree(x,335,i%2?"#13864e":"#087447",1.3);
  }
 }

 // LEVEL 2: MOUNTAIN WORLD
 else if(world===2){

  circle(780,90,42,"#fff4bd");

  for(let i=0;i<7;i++){
   let x=parallax(.2,1250)+i*200-100;
   mountain(x,390,230,220,"#7295ad");
   mountain(x+55,235,120,65,"#ffffff");
  }

  for(let i=0;i<11;i++){
   let x=parallax(.48,1300)+i*125-80;
   ctx.fillStyle="#315d43";
   ctx.fillRect(x-5,325,12,90);
   mountain(x-35,345,75,110,"#276b46");
   mountain(x-30,295,65,85,"#398a55");
  }

  for(let i=0;i<4;i++){
   cloud(i*260+80,105,1);
  }
 }

 // LEVEL 3: MYSTERY CAVE
 else if(world===3){

  for(let i=0;i<35;i++){
   let x=(i*137+40)%W;
   let y=(i*83+30)%280;
   circle(x,y,2,i%2?"#a9edff":"#c99cff");
  }

  // Cave ceiling
  ctx.fillStyle="#29213e";
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(W,0);
  ctx.lineTo(W,160);
  for(let x=W;x>=0;x-=80){
   ctx.lineTo(x,145+Math.sin(x*.04)*25);
  }
  ctx.closePath();
  ctx.fill();

  // Crystal formations
  for(let i=0;i<12;i++){
   let x=parallax(.4,1100)+i*110-60;
   ctx.fillStyle=i%2?"#8d6be0":"#52d4e5";
   ctx.beginPath();
   ctx.moveTo(x,380);
   ctx.lineTo(x+22,260+(i%3)*20);
   ctx.lineTo(x+45,380);
   ctx.fill();

   circle(x+22,300+(i%3)*20,5,"#ffffff");
  }

  // Rock shapes
  for(let i=0;i<7;i++){
   let x=parallax(.2,1100)+i*180;
   mountain(x,460,180,130,"#383047");
  }
 }

 // LEVEL 4: DESERT WORLD
 else if(world===4){

  circle(790,90,54,"#ffe89a");

  // Sand dunes
  for(let i=0;i<7;i++){
   let x=parallax(.18,1200)+i*190-100;
   ctx.fillStyle=i%2?"#e9b66c":"#d69b51";
   ctx.beginPath();
   ctx.ellipse(x+90,400,160,90,0,Math.PI,Math.PI*2);
   ctx.fill();
  }

  // Pyramids
  for(let i=0;i<5;i++){
   let x=parallax(.3,1100)+i*250-80;
   mountain(x,380,180,160,"#b87943");
   ctx.strokeStyle="#e6bd78";
   ctx.lineWidth=3;
   ctx.beginPath();
   ctx.moveTo(x+90,220);
   ctx.lineTo(x+90,380);
   ctx.stroke();
  }

  // Cactus
  for(let i=0;i<9;i++){
   let x=parallax(.5,1200)+i*150;
   ctx.fillStyle="#37854b";
   ctx.fillRect(x,330,20,90);
   ctx.fillRect(x-22,355,22,12);
   ctx.fillRect(x-22,340,12,27);
   ctx.fillRect(x+15,370,22,12);
   ctx.fillRect(x+25,350,12,32);
  }
 }

 // LEVEL 5: ICE WORLD
 else if(world===5){

  circle(790,85,38,"#ffffff");

  for(let i=0;i<8;i++){
   let x=parallax(.2,1250)+i*190-100;
   mountain(x,390,220,240,"#8bc6e8");
   mountain(x+60,240,100,100,"#ffffff");
  }

  // Frozen pine trees
  for(let i=0;i<12;i++){
   let x=parallax(.5,1300)+i*115-70;

   ctx.fillStyle="#ffffff";
   ctx.fillRect(x-5,340,12,85);

   mountain(x-35,355,75,95,"#2d8399");
   mountain(x-30,315,65,75,"#51a7bb");
   mountain(x-25,280,55,60,"#aee8f3");
  }

  for(let i=0;i<25;i++){
   circle((i*83)%W,(i*67)%H,2,"#ffffff");
  }
 }

 // LEVEL 6: VOLCANO WORLD
 else if(world===6){

  circle(790,90,52,"#ffbd4d");

  for(let i=0;i<6;i++){
   let x=parallax(.25,1200)+i*220-100;
   mountain(x,400,250,230,"#552c35");

   ctx.fillStyle="#ff6034";
   ctx.beginPath();
   ctx.moveTo(x+100,205);
   ctx.lineTo(x+135,300);
   ctx.lineTo(x+115,330);
   ctx.lineTo(x+165,400);
   ctx.lineTo(x+80,400);
   ctx.closePath();
   ctx.fill();
  }

  // Lava glow
  ctx.fillStyle="#f04b27";
  ctx.fillRect(0,H-85,W,85);

  for(let i=0;i<14;i++){
   circle((i*97-camera*.35)%W,420+(i%3)*25,9,"#ffb52e");
  }

  // Smoke
  for(let i=0;i<9;i++){
   let x=(i*135-camera*.2)%W;
   circle(x,130+(i%3)*35,24,"#60434a");
  }
 }

 // LEVEL 7: RIVER WORLD
 else if(world===7){

  circle(790,85,43,"#fff4ad");

  for(let i=0;i<6;i++){
   let x=parallax(.2,1200)+i*220-100;
   mountain(x,365,220,150,"#4c9e86");
  }

  // Waterfall and river
  ctx.fillStyle="#319fca";
  ctx.fillRect(0,400,W,140);

  for(let i=0;i<14;i++){
   let x=(i*85-camera*.5)%W;
   ctx.strokeStyle="#a8edfa";
   ctx.lineWidth=3;
   ctx.beginPath();
   ctx.moveTo(x,435+(i%3)*20);
   ctx.lineTo(x+40,435+(i%3)*20);
   ctx.stroke();
  }

  // River trees
  for(let i=0;i<9;i++){
   let x=parallax(.5,1200)+i*155-60;
   tree(x,320,i%2?"#27804c":"#126b50",.9);
  }

  // Waterfall
  ctx.fillStyle="#a9eafa";
  ctx.fillRect(720,280,65,150);
  ctx.fillStyle="#ffffff88";
  ctx.fillRect(735,280,12,150);
 }

 // LEVEL 8: NIGHT FOREST
 else if(world===8){

  circle(780,95,47,"#f4edc9");

  for(let i=0;i<50;i++){
   let x=(i*79)%W;
   let y=(i*53)%270;
   circle(x,y,2,i%2?"#ffffff":"#d3a9ff");
  }

  for(let i=0;i<8;i++){
   let x=parallax(.25,1200)+i*200-100;
   mountain(x,390,220,170,"#252c48");
  }

  // Purple glowing trees
  for(let i=0;i<12;i++){
   let x=parallax(.5,1300)+i*125-60;
   tree(x,330,i%2?"#49356f":"#263d59",1.2);
   circle(x,285,5,"#b98aff");
  }

  // Fireflies
  for(let i=0;i<15;i++){
   let x=(i*93+frame*.3)%W;
   let y=150+(i*47)%230;
   circle(x,y,3,"#eaff91");
  }
 }

 // LEVEL 9: SKY WORLD
 else if(world===9){

  circle(780,85,48,"#fff7bd");

  // Floating clouds
  for(let i=0;i<9;i++){
   let x=((i*170-camera*.25)%1200+1200)%1200-100;
   cloud(x,130+(i%3)*85,.9);
  }

  // Floating islands
  for(let i=0;i<6;i++){
   let x=parallax(.35,1200)+i*215-100;
   ctx.fillStyle="#6b9d79";
   ctx.beginPath();
   ctx.moveTo(x,365);
   ctx.lineTo(x+40,410);
   ctx.lineTo(x+100,435);
   ctx.lineTo(x+155,410);
   ctx.lineTo(x+190,365);
   ctx.fill();

   ctx.fillStyle="#4dbb75";
   ctx.fillRect(x,350,190,12);
  }

  for(let i=0;i<20;i++){
   let x=(i*77)%W;
   let y=300+(i*31)%150;
   circle(x,y,4,"#ffffff");
  }
 }

 // LEVEL 10: FINAL CASTLE
 else if(world===10){

  circle(790,95,48,"#ffb56b");

  // Distant dark mountains
  for(let i=0;i<7;i++){
   let x=parallax(.2,1200)+i*200-100;
   mountain(x,420,230,210,"#3c304a");
  }

  // Giant castle
  ctx.fillStyle="#493344";
  ctx.fillRect(340,210,330,240);

  ctx.fillRect(300,170,75,280);
  ctx.fillRect(630,170,75,280);

  // Towers
  ctx.fillStyle="#bd6254";
  for(let i=0;i<3;i++){
   let x=300+i*165;
   ctx.fillRect(x,150,65,35);
   ctx.beginPath();
   ctx.moveTo(x-10,150);
   ctx.lineTo(x+32,90);
   ctx.lineTo(x+75,150);
   ctx.fill();
  }

  // Castle windows
  ctx.fillStyle="#ffbd62";
  for(let i=0;i<5;i++){
   ctx.fillRect(375+i*55,260,22,45);
  }

  // Main gate
  ctx.fillStyle="#241c2a";
  ctx.beginPath();
  ctx.arc(505,450,55,Math.PI,0);
  ctx.fill();
  ctx.fillRect(450,395,110,55);

  // Dark clouds
  for(let i=0;i<6;i++){
   let x=(i*190-camera*.15)%W;
   cloud(x,110,1.1);
  }
 }

}

function drawPlatforms(){

 const worldStyles = [
  ["#754323","#258c42","#a66a3c","#43bd52"],
  ["#80502c","#368b42","#ad7542","#62c94d"],
  ["#554044","#277b50","#805c63","#40b982"],
  ["#b87936","#a4a044","#d49b52","#d9c75b"],
  ["#567b9d","#d8edf5","#7199b5","#ffffff"],
  ["#713b32","#b83d27","#94452e","#ef6937"],
  ["#78502f","#268d62","#a77b45","#48c78a"],
  ["#493b62","#246b55","#66517b","#58a66d"],
  ["#526b9b","#478bbd","#829ac4","#8ed5ff"],
  ["#55404a","#a23e35","#79505a","#d85a49"]
 ];

 const style = worldStyles[(level-1)%10];

 const dirt = style[0];
 const grass = style[1];
 const tile = style[2];
 const lightGrass = style[3];

 platforms.forEach((p,index)=>{

  let x=p[0]-camera;
  let y=p[1];
  let width=p[2];
  let height=H-y;

  if(x>W || x+width<0) return;

  // Main soil
  ctx.fillStyle=dirt;
  ctx.fillRect(x,y,width,height);

  // Checkerboard soil pattern
  const tileSize=38;

  for(let row=0;row<Math.ceil(height/tileSize);row++){
   for(let col=0;col<Math.ceil(width/tileSize);col++){

    let tx=x+col*tileSize;
    let ty=y+12+row*tileSize;

    if((row+col)%2===0){
     ctx.fillStyle=tile;
    }else{
     ctx.fillStyle=dirt;
    }

    ctx.fillRect(
     tx,
     ty,
     Math.min(tileSize,width-col*tileSize),
     Math.min(tileSize,height-(ty-y))
    );

    ctx.strokeStyle="#00000018";
    ctx.lineWidth=1;
    ctx.strokeRect(tx,ty,tileSize,tileSize);
   }
  }

  // Grass top layer
  ctx.fillStyle=grass;
  ctx.fillRect(x,y,width,13);

  // Bright grass highlight
  ctx.fillStyle=lightGrass;
  ctx.fillRect(x,y,width,4);

  // Rounded grass edges
  for(let a=0;a<width;a+=20){
   ctx.beginPath();
   ctx.ellipse(
    x+a+10,
    y+10,
    11,
    6,
    0,0,Math.PI*2
   );
   ctx.fillStyle=grass;
   ctx.fill();
  }

  // Small grass decorations
  ctx.fillStyle=lightGrass;

  for(let a=18;a<width;a+=75){
   ctx.beginPath();
   ctx.moveTo(x+a,y+3);
   ctx.lineTo(x+a+5,y-5);
   ctx.lineTo(x+a+9,y+3);
   ctx.fill();
  }

 });

}

function drawEnemy(e){
 if(!e.alive)return;
 let x=e.x-camera,y=e.y,s=e.size;

 ctx.save();

 // Shadow
 ctx.fillStyle="#0003";
 ctx.beginPath();
 ctx.ellipse(x,y+s+2,s*.48,5,0,0,7);
 ctx.fill();

 // Body
 ctx.fillStyle="#a94ee3";
 ctx.beginPath();
 ctx.ellipse(x,y+s*.55,s*.52,s*.48,0,0,7);
 ctx.fill();

 // Spikes
 for(let i=0;i<7;i++){
  let a=i*Math.PI*2/7;
  ctx.fillStyle="#d58aff";
  ctx.beginPath();
  ctx.arc(x+Math.cos(a)*s*.48,y+s*.52+Math.sin(a)*s*.48,9,0,7);
  ctx.fill();
 }

 // Eyes
 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(x-8,y+12,7,0,7);
 ctx.arc(x+8,y+12,7,0,7);
 ctx.fill();
 ctx.fillStyle="#241337";
 ctx.beginPath();
 ctx.arc(x-8,y+12,3,0,7);
 ctx.arc(x+8,y+12,3,0,7);
 ctx.fill();

 ctx.strokeStyle="#32143f";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(x-9,y+27);
 ctx.lineTo(x+9,y+27);
 ctx.stroke();

 ctx.restore();
}

function drawHero(){

  if(!heroSheet.complete || !heroSheet.naturalWidth) return;

  if(player.inv > 0 && Math.floor(frame/5)%2===0) return;

  const moving = keys.left || keys.right;
  const jumping = !player.ground;

  const centerX = player.x + player.w/2;
  const feetY = player.y + player.h;

  ctx.save();

  // Ground shadow
  ctx.fillStyle="#0005";
  ctx.beginPath();
  ctx.ellipse(centerX-camera,feetY,25,6,0,0,Math.PI*2);
  ctx.fill();

  let sx,sy,sw,sh;
  let drawWidth,drawHeight;
  let walkBob = 0;

  if(moving && player.ground &&
     heroRunSheet.complete && heroRunSheet.naturalWidth){

    // 4 Running Frames
    const runFrames = [
      [86,121,86,99],
      [206,122,77,98],
      [312,122,82,98],
      [422,123,81,97]
    ];

    const index = Math.floor(frame/7)%4;

    [sx,sy,sw,sh] = runFrames[index];

    drawWidth = 130;
    drawHeight = 150;

    ctx.translate(centerX-camera,feetY);

    if(player.face===-1){
      ctx.scale(-1,1);
    }

    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality="high";

    ctx.drawImage(
      heroRunSheet,
      sx,sy,sw,sh,
      -drawWidth/2,-drawHeight,
      drawWidth,drawHeight
    );

  }else{

    // Old Standing and Jumping Poses
    if(jumping){
      sx=944; sy=95; sw=398; sh=588;
    }else{
      sx=73; sy=145; sw=287; sh=663;
    }

    drawHeight=150;
    drawWidth=drawHeight*(sw/sh);

    ctx.translate(centerX-camera,feetY);

    if(player.face===-1){
      ctx.scale(-1,1);
    }

    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality="high";

    ctx.drawImage(
      heroSheet,
      sx,sy,sw,sh,
      -drawWidth/2,-drawHeight,
      drawWidth,drawHeight
    );
  }

  ctx.restore();
}

function drawCoins(){
 treasures.forEach(t=>{
  if(t.got)return;
  let x=t.x-camera;
  if(x<-30||x>W+30)return;

  ctx.fillStyle="#ffba08";
  ctx.beginPath();
  ctx.arc(x,t.y,17,0,7);
  ctx.fill();

  ctx.strokeStyle="#fff0a0";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.fillStyle="white";
  ctx.font="bold 16px Arial";
  ctx.textAlign="center";
  ctx.fillText("V",x,t.y+6);
 });
}

function drawFinish(){
 let x=finishX-camera;
 ctx.fillStyle="#65452d";
 ctx.fillRect(x,platforms[platforms.length-1][1]-100,8,100);
 ctx.fillStyle="#ffda35";
 ctx.beginPath();
 ctx.moveTo(x+8,platforms[platforms.length-1][1]-100);
 ctx.lineTo(x+80,platforms[platforms.length-1][1]-80);
 ctx.lineTo(x+8,platforms[platforms.length-1][1]-60);
 ctx.fill();
}

function draw(){
 background();
 drawPlatforms();
 drawCoins();
 enemies.forEach(drawEnemy);
 drawFinish();
 drawHero();

 // Progress bar
 ctx.fillStyle="#174d69";
 roundRect(365,15,230,14,8);
 ctx.fillStyle="#ffda35";
 roundRect(365,15,230*Math.min(1,player.x/finishX),14,8);

 ctx.fillStyle="white";
 ctx.font="bold 14px Arial";
 ctx.textAlign="left";
 ctx.fillText("JUNGLE LEVEL "+level,20,30);
}

function update(){
 if(!running||paused||gameOver)return;

 frame++;
 let oldY=player.y;

 player.vx=0;
 if(keys.left){player.vx=-5;player.face=-1}
 if(keys.right){player.vx=5;player.face=1}

 player.x=Math.max(0,Math.min(worldWidth-player.w,player.x+player.vx));

 if(keys.jump&&player.ground){
  player.vy=-15;
  player.ground=false;
 }
 keys.jump=false;

 player.vy=Math.min(14,player.vy+.65);
 player.y+=player.vy;
 player.ground=false;

 platforms.forEach(p=>{
  if(player.x+player.w>p[0]&&player.x<p[0]+p[2]&&
     oldY+player.h<=p[1]+10&&
     player.y+player.h>=p[1]&&player.vy>=0){
   player.y=p[1]-player.h;
   player.vy=0;
   player.ground=true;
  }
 });

 // Collect coins
 treasures.forEach(t=>{
  if(!t.got&&Math.abs(player.x+24-t.x)<28&&
     Math.abs(player.y+35-t.y)<35){
   t.got=true;
   coins++;
   updateUI();
  }
 });

 // Monster movement and collision
 enemies.forEach(e=>{
  if(!e.alive)return;

  e.x+=e.dir*1.1;
  if(e.x>e.max)e.dir=-1;
  if(e.x<e.min)e.dir=1;

  // Monster always stays on platform
  let p=platforms.find(p=>e.x>=p[0]&&e.x<=p[0]+p[2]);
  if(p)e.y=p[1]-e.size;

  let hit=player.x+player.w-8>e.x-e.size*.45&&
          player.x+8<e.x+e.size*.45&&
          player.y+player.h-8>e.y&&
          player.y+8<e.y+e.size;

  if(hit&&player.inv<=0){
   if(player.vy>2&&oldY+player.h<e.y+12){
    e.alive=false;
    player.vy=-8;
    coins+=5;
   }else{
    lives--;
    player.inv=100;
    player.vy=-6;
    if(lives<=0)finishGame(false);
   }
   updateUI();
  }
 });

 if(player.inv>0)player.inv--;

 if(player.y>H+100){
  lives--;
  player.inv=100;
  player.y=platforms[0][1]-player.h;
  player.x=Math.max(30,player.x-150);
  player.vy=0;
  if(lives<=0)finishGame(false);
  updateUI();
 }

 camera=Math.max(0,Math.min(worldWidth-W,player.x-W*.38));

 if(player.x>=finishX)nextLevel();
}

function nextLevel(){
 if(level>=10){
  finishGame(true);
  return;
 }
 level++;
 makeLevel();
 showMessage("LEVEL "+(level-1)+" COMPLETE!","Welcome to the next jungle!");
}

function showMessage(title,message){
 paused=true;
 document.getElementById("msgTitle").textContent=title;
 document.getElementById("msgText").textContent=message;
 document.getElementById("continue").textContent="CONTINUE";
 document.getElementById("message").style.display="flex";
}

function finishGame(win){
 running=false;
 gameOver=true;
 paused=true;
 document.getElementById("msgTitle").textContent=win?"🏆 YOU ARE THE JUNGLE HERO!":"GAME OVER";
 document.getElementById("msgText").textContent="Coins collected: "+coins;
 document.getElementById("continue").textContent="PLAY AGAIN";
 document.getElementById("message").style.display="flex";
}

document.getElementById("continue").onclick=()=>{
 document.getElementById("message").style.display="none";

 if(gameOver){
  level=1;
  coins=0;
  lives=3;
  gameOver=false;
  makeLevel();
 }
 paused=false;
 running=true;
};

document.getElementById("pause").onclick=()=>{
 if(!running||gameOver)return;
 paused=!paused;
 if(paused)showMessage("GAME PAUSED","Take a break, hero!");
 else document.getElementById("message").style.display="none";
};

function bindButton(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
  b.setPointerCapture(e.pointerId);
 });
 const release=()=>keys[key]=false;
 b.addEventListener("pointerup",release);
 b.addEventListener("pointercancel",release);
 b.addEventListener("lostpointercapture",release);
}

bindButton("left","left");
bindButton("right","right");

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 keys.jump=true;
});

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key==="ArrowUp"||e.key===" "||e.key==="w")keys.jump=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

makeLevel();
running=true;
loop();
</script>
</body>
</html>
