<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VEER ADVENTURE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#071d31;
 color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
 touch-action:none;
}
#app{
 width:100%;
 height:100dvh;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:space-between;
}
header{
 width:100%;
 min-height:58px;
 background:#092c46;
 display:flex;
 justify-content:space-around;
 align-items:center;
 padding:5px 12px;
 gap:8px;
}
.logo{font-size:clamp(16px,2.5vw,27px);font-weight:bold;color:#ffd43b}
.info{font-size:clamp(13px,2vw,21px);font-weight:bold;white-space:nowrap}
#pause{
 background:#ffcf35;
 color:#102b43;
 border:0;
 border-radius:12px;
 padding:10px 17px;
 font-size:22px;
 font-weight:bold;
}
#gameBox{
 width:min(100vw, calc((100dvh - 135px)*1.7778));
 aspect-ratio:16/9;
 max-height:calc(100dvh - 135px);
 position:relative;
}
canvas{
 width:100%;
 height:100%;
 display:block;
 background:#70c9ef;
 border-radius:3px;
}
#controls{
 width:100%;
 min-height:105px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:8px 7%;
 background:#071d31;
}
.group{display:flex;gap:12px}
.ctrl{
 width:clamp(58px,10vw,90px);
 height:clamp(54px,9vw,78px);
 border:3px solid #65c5ff;
 border-radius:17px;
 background:linear-gradient(#168cf5,#0752b9);
 color:white;
 font-size:clamp(24px,4vw,38px);
 font-weight:bold;
 box-shadow:0 5px #063c80;
 touch-action:none;
}
#jump{
 width:clamp(105px,17vw,155px);
 height:clamp(55px,9vw,76px);
 border:3px solid #ffe18a;
 border-radius:18px;
 background:linear-gradient(#ffdf49,#ff9f08);
 color:#17334a;
 font-size:clamp(17px,3vw,25px);
 font-weight:bold;
 box-shadow:0 5px #a65c00;
}
#message{
 position:absolute;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#0009;
}
.panel{
 background:#092c46;
 border:2px solid #ffd43b;
 border-radius:18px;
 padding:22px;
 text-align:center;
 width:min(85%,350px);
}
.panel h2{font-size:22px;margin-bottom:10px}
.panel p{font-size:15px;margin-bottom:15px}
.panel button{
 padding:11px 25px;
 background:#ffcf35;
 border:0;border-radius:10px;
 font-size:17px;font-weight:bold;
}
@media(max-height:430px){
 header{min-height:42px}
 #gameBox{width:min(100vw,calc((100dvh - 92px)*1.7778));max-height:calc(100dvh - 92px)}
 #controls{min-height:50px;padding:3px 7%}
 .ctrl{height:42px}
 #jump{height:42px}
}
</style>
</head>

<body>
<div id="app">

<header>
 <div class="logo">🌴 VEER ADVENTURE</div>
 <div class="info" id="level">LEVEL 1 / 10</div>
 <div class="info" id="coins">🪙 0</div>
 <div class="info" id="lives">❤️ 3</div>
 <button id="pause">Ⅱ</button>
</header>

<div id="gameBox">
 <canvas id="game" width="960" height="540"></canvas>
 <div id="message">
  <div class="panel">
   <h2 id="msgTitle">LEVEL COMPLETE!</h2>
   <p id="msgText">Next jungle awaits!</p>
   <button id="continue">CONTINUE</button>
  </div>
 </div>
</div>

<div id="controls">
 <div class="group">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <button id="jump">⬆ JUMP</button>
</div>

</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=960,H=540;

let level=1,coins=0,lives=3;
let running=false,paused=false,gameOver=false;
let camera=0,frame=0;
let platforms=[],enemies=[],treasures=[];
let finishX=0,worldWidth=0;

const keys={left:false,right:false,jump:false};

const maps=[
 [[0,455,650],[760,400,300],[1120,450,350],[1570,390,320],[2040,440,350],[2510,380,350],[3020,455,450]],
 [[0,455,650],[730,420,260],[1080,365,300],[1500,430,280],[1900,355,330],[2370,405,320],[2830,455,500]],
 [[0,455,500],[650,400,300],[1050,455,250],[1450,350,350],[1900,405,300],[2350,330,350],[2800,455,500]],
 [[0,455,700],[820,370,280],[1210,430,250],[1590,350,330],[2050,455,280],[2450,380,350],[2940,455,500]],
 [[0,455,450],[600,380,300],[1000,320,280],[1400,420,300],[1840,350,330],[2300,400,300],[2760,455,550]],
 [[0,455,600],[750,390,280],[1150,330,300],[1580,420,280],[2000,350,350],[2480,400,300],[2930,455,500]],
 [[0,455,500],[650,350,280],[1050,420,300],[1500,320,300],[1950,390,350],[2450,340,300],[2900,455,500]],
 [[0,455,700],[820,410,250],[1200,340,300],[1630,440,300],[2080,360,280],[2500,420,300],[2950,455,500]],
 [[0,455,500],[650,390,300],[1100,330,280],[1510,410,300],[1950,320,350],[2430,390,300],[2890,455,550]],
 [[0,455,600],[750,350,300],[1200,430,300],[1650,330,350],[2130,400,300],[2580,340,350],[3070,455,600]]
];

function makeLevel(){
 camera=0;
 frame=0;
 platforms=maps[level-1].map(p=>[...p]);
 worldWidth=platforms[platforms.length-1][0]+platforms[platforms.length-1][2];
 finishX=worldWidth-120;

 const start=platforms[0];
 player={x:80,y:start[1]-72,w:48,h:72,vx:0,vy:0,ground:true,inv:0,face:1};

 treasures=[];
 enemies=[];

 platforms.forEach((p,i)=>{
  if(i===0||i===platforms.length-1)return;

  for(let j=0;j<2;j++){
   treasures.push({
    x:p[0]+70+j*85,
    y:p[1]-85,
    got:false
   });
  }

  if(i%2===1){
   const size=36;
   enemies.push({
    x:p[0]+p[2]/2,
    home:p[0]+p[2]/2,
    min:p[0]+size,
    max:p[0]+p[2]-size,
    y:p[1]-size,
    size,dir:1,alive:true
   });
  }
 });

 updateUI();
}

let player={};

function updateUI(){
 document.getElementById("level").textContent="LEVEL "+level+" / 10";
 document.getElementById("coins").textContent="🪙 "+coins;
 document.getElementById("lives").textContent="❤️ "+lives;
}

function roundRect(x,y,w,h,r){
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function background(){
 let g=ctx.createLinearGradient(0,0,0,H);
 const colors=[
  ["#62c9f5","#d9f7c0"],
  ["#faad55","#fff0b5"],
  ["#6758ac","#f6b2c7"],
  ["#42a9a0","#c7f2cd"],
  ["#ef9872","#ffe2a0"],
  ["#4285a9","#d5eff5"],
  ["#9c8ac8","#f9d9e8"],
  ["#f0a65d","#fff0ae"],
  ["#428c91","#c8e8b9"],
  ["#433f7e","#f2b6a0"]
 ];
 g.addColorStop(0,colors[level-1][0]);
 g.addColorStop(1,colors[level-1][1]);
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 // Sun
 ctx.fillStyle="#fff3a0";
 ctx.beginPath();
 ctx.arc(810,85,48,0,Math.PI*2);
 ctx.fill();

 // Clouds
 for(let i=0;i<6;i++){
  let x=((i*230-camera*.15)%1100+1100)%1100-50;
  ctx.fillStyle="#ffffffcc";
  ctx.beginPath();
  ctx.arc(x,115,28,0,7);
  ctx.arc(x+30,100,35,0,7);
  ctx.arc(x+65,117,27,0,7);
  ctx.fill();
 }

 // Mountains
 ctx.fillStyle="#398e83";
 for(let i=0;i<7;i++){
  let x=((i*220-camera*.3)%1200+1200)%1200-100;
  ctx.beginPath();
  ctx.moveTo(x,360);
  ctx.lineTo(x+110,185);
  ctx.lineTo(x+220,360);
  ctx.fill();
 }

 // Trees
 for(let i=0;i<12;i++){
  let x=((i*150-camera*.48)%1250+1250)%1250-120;
  ctx.fillStyle="#68452d";
  ctx.fillRect(x+25,300,32,170);
  ctx.fillStyle=i%2?"#13864e":"#087447";
  ctx.beginPath();
  ctx.arc(x+40,275,63,0,7);
  ctx.arc(x+4,285,43,0,7);
  ctx.arc(x+77,285,43,0,7);
  ctx.fill();
 }
}

function drawPlatforms(){
 platforms.forEach(p=>{
  let x=p[0]-camera;
  if(x>W||x+p[2]<0)return;

  ctx.fillStyle="#754323";
  ctx.fillRect(x,p[1],p[2],H-p[1]);

  ctx.fillStyle="#258c42";
  ctx.fillRect(x,p[1],p[2],9);

  ctx.fillStyle="#a66a3c";
  for(let a=20;a<p[2]-10;a+=55){
   ctx.fillRect(x+a,p[1]+27,24,7);
  }

  ctx.fillStyle="#3caa55";
  for(let a=12;a<p[2];a+=48){
   ctx.beginPath();
   ctx.ellipse(x+a,p[1]-3,8,7,0,0,7);
   ctx.fill();
  }
 });
}

function drawEnemy(e){
 if(!e.alive)return;
 let x=e.x-camera,y=e.y,s=e.size;

 ctx.save();

 // Shadow
 ctx.fillStyle="#0003";
 ctx.beginPath();
 ctx.ellipse(x,y+s+2,s*.48,5,0,0,7);
 ctx.fill();

 // Body
 ctx.fillStyle="#a94ee3";
 ctx.beginPath();
 ctx.ellipse(x,y+s*.55,s*.52,s*.48,0,0,7);
 ctx.fill();

 // Spikes
 for(let i=0;i<7;i++){
  let a=i*Math.PI*2/7;
  ctx.fillStyle="#d58aff";
  ctx.beginPath();
  ctx.arc(x+Math.cos(a)*s*.48,y+s*.52+Math.sin(a)*s*.48,9,0,7);
  ctx.fill();
 }

 // Eyes
 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(x-8,y+12,7,0,7);
 ctx.arc(x+8,y+12,7,0,7);
 ctx.fill();
 ctx.fillStyle="#241337";
 ctx.beginPath();
 ctx.arc(x-8,y+12,3,0,7);
 ctx.arc(x+8,y+12,3,0,7);
 ctx.fill();

 ctx.strokeStyle="#32143f";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(x-9,y+27);
 ctx.lineTo(x+9,y+27);
 ctx.stroke();

 ctx.restore();
}

function drawHero(){
 let x=player.x-camera,y=player.y;
 if(player.inv>0 && Math.floor(frame/5)%2===0)return;

 ctx.save();

 // Shadow
 ctx.fillStyle="#0004";
 ctx.beginPath();
 ctx.ellipse(x+24,y+72,25,7,0,0,7);
 ctx.fill();

 // Legs
 ctx.strokeStyle="#151a27";
 ctx.lineWidth=11;
 ctx.lineCap="round";
 let walk=player.ground?Math.sin(frame*.22)*5:0;
 ctx.beginPath();
 ctx.moveTo(x+17,y+48);
 ctx.lineTo(x+15+walk,y+64);
 ctx.lineTo(x+10+walk,y+68);
 ctx.moveTo(x+31,y+48);
 ctx.lineTo(x+33-walk,y+64);
 ctx.lineTo(x+39-walk,y+68);
 ctx.stroke();

 // Shoes
 ctx.fillStyle="#101827";
 roundRect(x+3+walk,y+63,17,9,4);
 roundRect(x+30-walk,y+63,17,9,4);

 // Body jacket
 ctx.fillStyle="#151d30";
 roundRect(x+7,y+25,35,30,10);

 // Jacket details
 ctx.fillStyle="#344a69";
 ctx.fillRect(x+23,y+29,3,24);
 ctx.fillStyle="#ffda3a";
 ctx.beginPath();
 ctx.arc(x+24,y+39,4,0,7);
 ctx.fill();

 // Arms
 ctx.strokeStyle="#171d30";
 ctx.lineWidth=10;
 ctx.beginPath();
 ctx.moveTo(x+9,y+31);
 ctx.lineTo(x+2,y+46+walk*.5);
 ctx.moveTo(x+40,y+31);
 ctx.lineTo(x+47,y+46-walk*.5);
 ctx.stroke();

 // Hands
 ctx.fillStyle="#bd805c";
 ctx.beginPath();
 ctx.arc(x+2,y+47+walk*.5,5,0,7);
 ctx.arc(x+47,y+47-walk*.5,5,0,7);
 ctx.fill();

 // Neck
 ctx.fillStyle="#bd805c";
 ctx.fillRect(x+18,y+19,13,10);

 // Face
 ctx.fillStyle="#d59a70";
 roundRect(x+10,y+3,29,28,9);

 // Hair
 ctx.fillStyle="#101522";
 ctx.beginPath();
 ctx.arc(x+24,y+10,15,Math.PI,0);
 ctx.fill();
 ctx.fillRect(x+9,y+7,6,11);
 ctx.fillRect(x+34,y+7,6,11);

 // Sunglasses
 ctx.fillStyle="#080d18";
 roundRect(x+11,y+14,27,8,3);
 ctx.fillStyle="#68d4ff";
 ctx.fillRect(x+14,y+16,8,2);
 ctx.fillRect(x+27,y+16,8,2);

 // Face details
 ctx.strokeStyle="#75412e";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(x+20,y+25);
 ctx.lineTo(x+29,y+25);
 ctx.stroke();

 ctx.restore();
}

function drawCoins(){
 treasures.forEach(t=>{
  if(t.got)return;
  let x=t.x-camera;
  if(x<-30||x>W+30)return;

  ctx.fillStyle="#ffba08";
  ctx.beginPath();
  ctx.arc(x,t.y,17,0,7);
  ctx.fill();

  ctx.strokeStyle="#fff0a0";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.fillStyle="white";
  ctx.font="bold 16px Arial";
  ctx.textAlign="center";
  ctx.fillText("V",x,t.y+6);
 });
}

function drawFinish(){
 let x=finishX-camera;
 ctx.fillStyle="#65452d";
 ctx.fillRect(x,platforms[platforms.length-1][1]-100,8,100);
 ctx.fillStyle="#ffda35";
 ctx.beginPath();
 ctx.moveTo(x+8,platforms[platforms.length-1][1]-100);
 ctx.lineTo(x+80,platforms[platforms.length-1][1]-80);
 ctx.lineTo(x+8,platforms[platforms.length-1][1]-60);
 ctx.fill();
}

function draw(){
 background();
 drawPlatforms();
 drawCoins();
 enemies.forEach(drawEnemy);
 drawFinish();
 drawHero();

 // Progress bar
 ctx.fillStyle="#174d69";
 roundRect(365,15,230,14,8);
 ctx.fillStyle="#ffda35";
 roundRect(365,15,230*Math.min(1,player.x/finishX),14,8);

 ctx.fillStyle="white";
 ctx.font="bold 14px Arial";
 ctx.textAlign="left";
 ctx.fillText("JUNGLE LEVEL "+level,20,30);
}

function update(){
 if(!running||paused||gameOver)return;

 frame++;
 let oldY=player.y;

 player.vx=0;
 if(keys.left){player.vx=-5;player.face=-1}
 if(keys.right){player.vx=5;player.face=1}

 player.x=Math.max(0,Math.min(worldWidth-player.w,player.x+player.vx));

 if(keys.jump&&player.ground){
  player.vy=-15;
  player.ground=false;
 }
 keys.jump=false;

 player.vy=Math.min(14,player.vy+.65);
 player.y+=player.vy;
 player.ground=false;

 platforms.forEach(p=>{
  if(player.x+player.w>p[0]&&player.x<p[0]+p[2]&&
     oldY+player.h<=p[1]+10&&
     player.y+player.h>=p[1]&&player.vy>=0){
   player.y=p[1]-player.h;
   player.vy=0;
   player.ground=true;
  }
 });

 // Collect coins
 treasures.forEach(t=>{
  if(!t.got&&Math.abs(player.x+24-t.x)<28&&
     Math.abs(player.y+35-t.y)<35){
   t.got=true;
   coins++;
   updateUI();
  }
 });

 // Monster movement and collision
 enemies.forEach(e=>{
  if(!e.alive)return;

  e.x+=e.dir*1.1;
  if(e.x>e.max)e.dir=-1;
  if(e.x<e.min)e.dir=1;

  // Monster always stays on platform
  let p=platforms.find(p=>e.x>=p[0]&&e.x<=p[0]+p[2]);
  if(p)e.y=p[1]-e.size;

  let hit=player.x+player.w-8>e.x-e.size*.45&&
          player.x+8<e.x+e.size*.45&&
          player.y+player.h-8>e.y&&
          player.y+8<e.y+e.size;

  if(hit&&player.inv<=0){
   if(player.vy>2&&oldY+player.h<e.y+12){
    e.alive=false;
    player.vy=-8;
    coins+=5;
   }else{
    lives--;
    player.inv=100;
    player.vy=-6;
    if(lives<=0)finishGame(false);
   }
   updateUI();
  }
 });

 if(player.inv>0)player.inv--;

 if(player.y>H+100){
  lives--;
  player.inv=100;
  player.y=platforms[0][1]-player.h;
  player.x=Math.max(30,player.x-150);
  player.vy=0;
  if(lives<=0)finishGame(false);
  updateUI();
 }

 camera=Math.max(0,Math.min(worldWidth-W,player.x-W*.38));

 if(player.x>=finishX)nextLevel();
}

function nextLevel(){
 if(level>=10){
  finishGame(true);
  return;
 }
 level++;
 makeLevel();
 showMessage("LEVEL "+(level-1)+" COMPLETE!","Welcome to the next jungle!");
}

function showMessage(title,message){
 paused=true;
 document.getElementById("msgTitle").textContent=title;
 document.getElementById("msgText").textContent=message;
 document.getElementById("continue").textContent="CONTINUE";
 document.getElementById("message").style.display="flex";
}

function finishGame(win){
 running=false;
 gameOver=true;
 paused=true;
 document.getElementById("msgTitle").textContent=win?"🏆 YOU ARE THE JUNGLE HERO!":"GAME OVER";
 document.getElementById("msgText").textContent="Coins collected: "+coins;
 document.getElementById("continue").textContent="PLAY AGAIN";
 document.getElementById("message").style.display="flex";
}

document.getElementById("continue").onclick=()=>{
 document.getElementById("message").style.display="none";

 if(gameOver){
  level=1;
  coins=0;
  lives=3;
  gameOver=false;
  makeLevel();
 }
 paused=false;
 running=true;
};

document.getElementById("pause").onclick=()=>{
 if(!running||gameOver)return;
 paused=!paused;
 if(paused)showMessage("GAME PAUSED","Take a break, hero!");
 else document.getElementById("message").style.display="none";
};

function bindButton(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
  b.setPointerCapture(e.pointerId);
 });
 const release=()=>keys[key]=false;
 b.addEventListener("pointerup",release);
 b.addEventListener("pointercancel",release);
 b.addEventListener("lostpointercapture",release);
}

bindButton("left","left");
bindButton("right","right");

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 keys.jump=true;
});

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key==="ArrowUp"||e.key===" "||e.key==="w")keys.jump=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

makeLevel();
running=true;
loop();
</script>
</body>
</html>
